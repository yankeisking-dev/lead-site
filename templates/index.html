<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>הלוואות חכמות</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:Rubik;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    direction:rtl;
}

/* HERO BACKGROUND */
.hero{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px 20px;
}

/* CARD */
.container{
    width:100%;
    max-width:520px;
    background:white;
    color:#111;
    border-radius:18px;
    box-shadow:0 25px 70px rgba(0,0,0,0.5);
    overflow:hidden;
}

/* TOP IMAGE SECTION */
.header-image{
    height:160px;
    background:
        linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.35)),
        url("https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1200&q=80");
    background-size:cover;
    background-position:center;
}

/* CONTENT */
.content{
    padding:28px;
}

h1{
    font-size:24px;
    margin:0 0 6px;
    font-weight:700;
}

p{
    color:#555;
    font-size:14px;
    margin-bottom:18px;
}

/* TRUST STRIP */
.trust{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#666;
    margin-bottom:15px;
}

.badge{
    background:#f1f5f9;
    padding:6px 10px;
    border-radius:8px;
}

/* FORM */
input,select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:14px;
    outline:none;
}

input:focus,select:focus{
    border-color:#2563eb;
}

/* BUTTON */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
    font-size:15px;
    transition:0.2s;
}

button:hover{
    transform:translateY(-1px);
    opacity:0.95;
}

/* SMALL TEXT */
.small{
    font-size:11px;
    color:#888;
    text-align:center;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="hero">

<div class="container">

    <div class="header-image"></div>

    <div class="content">

        <h1>בדיקת זכאות להלוואה</h1>
        <p>מלא פרטים וקבל הצעה מותאמת אישית תוך דקות</p>

        <div class="trust">
            <div class="badge">⚡ תשובה מהירה</div>
            <div class="badge">🔒 מאובטח</div>
            <div class="badge">📊 ללא התחייבות</div>
        </div>

        <form method="POST" action="/step2">

            <input name="name" placeholder="שם מלא" required>
            <input name="phone" placeholder="טלפון" required>
            <input name="email" placeholder="אימייל" required>
            <input name="age" placeholder="גיל" required>

            <select name="interest">
                <option value="חיילים משוחררים">הלוואה לחיילים משוחררים</option>
                <option value="כל מטרה">הלוואה לכל מטרה</option>
                <option value="רכב">הלוואה לרכב</option>
            </select>

            <button>המשך לקבלת הצעה</button>

        </form>

        <div class="small">
            מילוי הטופס אינו מחייב • הנתונים שלך נשמרים בצורה מאובטחת
        </div>

    </div>
</div>

</div>

</body>
</html>
