<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>הלוואות חכמות</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Rubik;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    direction:rtl;
}

.container{
    max-width:500px;
    margin:80px auto;
    background:white;
    color:#111;
    padding:30px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
}

h1{
    font-size:22px;
    margin-bottom:10px;
}

p{
    color:#555;
    font-size:14px;
}

input,select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:14px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>
</head>

<body>

<div class="container">

<h1>בדיקת זכאות להלוואה</h1>
<p>מלא פרטים וקבל הצעה תוך דקות</p>

<form method="POST" action="/step2">

<input name="name" placeholder="שם מלא" required>
<input name="phone" placeholder="טלפון" required>
<input name="email" placeholder="אימייל" required>
<input name="age" placeholder="גיל" required>

<select name="interest">
<option value="חיילים משוחררים">הלוואה לחיילים משוחררים</option>
<option value="כל מטרה">הלוואה לכל מטרה</option>
<option value="רכב">הלוואה לרכב</option>
</select>

<button>המשך</button>

</form>

</div>

</body>
</html>
