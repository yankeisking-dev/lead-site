<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>שלב 2</title>

<style>
body{
    font-family:Rubik;
    background:#0f172a;
    color:white;
    direction:rtl;
}

.card{
    max-width:500px;
    margin:70px auto;
    background:white;
    color:#111;
    padding:30px;
    border-radius:18px;
}

/* added for better UX */
label{
    display:block;
    margin-top:12px;
    margin-bottom:4px;
    font-weight:600;
    color:#111;
}

select,button{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ddd;
    box-sizing:border-box;
}

button{
    background:#0f172a;
    color:white;
    cursor:pointer;
    font-size:16px;
}
button:hover{
    opacity:0.9;
}
</style>
</head>

<body>

<div class="card">

<h2>שאלות נוספות</h2>

<form method="POST" action="/step3">

<input type="hidden" name="name" value="{{ data.name }}">
<input type="hidden" name="phone" value="{{ data.phone }}">
<input type="hidden" name="email" value="{{ data.email }}">
<input type="hidden" name="age" value="{{ data.age }}">
<input type="hidden" name="interest" value="{{ data.interest }}">

<label>האם יש לך כרטיס אשראי?</label>
<select name="credit_card">
    <option>כן</option>
    <option>לא</option>
</select>

<label>האם קיימות הגבלות?</label>
<select name="restrictions">
    <option>כן</option>
    <option>לא</option>
</select>

<label>האם יש נכס בבעלותך?</label>
<select name="property">
    <option>כן</option>
    <option>לא</option>
</select>

<label>סטטוס אישי</label>
<select name="status">
    <option>רווק</option>
    <option>נשוי</option>
    <option>גרוש</option>
</select>

<button type="submit">המשך</button>

</form>

</div>

</body>
</html>
