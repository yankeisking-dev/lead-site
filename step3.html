<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>שלב 3</title>

<style>
body{
    font-family:Rubik;
    background:linear-gradient(135deg,#0f172a,#111827);
    color:white;
    direction:rtl;
}

.card{
    max-width:500px;
    margin:70px auto;
    background:white;
    color:#111;
    padding:30px;
    border-radius:18px;
}

select,button{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
}

button{
    background:#10b981;
    color:white;
    border:none;
    font-weight:600;
}
</style>
</head>

<body>

<div class="card">

<h2>איך תרצה שניצור איתך קשר?</h2>

<form method="POST" action="/submit">

<input type="hidden" name="name" value="{{ data.name }}">
<input type="hidden" name="phone" value="{{ data.phone }}">
<input type="hidden" name="email" value="{{ data.email }}">
<input type="hidden" name="age" value="{{ data.age }}">
<input type="hidden" name="interest" value="{{ data.interest }}">
<input type="hidden" name="credit_card" value="{{ data.credit_card }}">
<input type="hidden" name="restrictions" value="{{ data.restrictions }}">
<input type="hidden" name="property" value="{{ data.property }}">
<input type="hidden" name="status" value="{{ data.status }}">

<select name="contact_method">
<option value="email">אימייל</option>
<option value="phone">טלפון</option>
</select>

<button>סיום ושליחה</button>

</form>

</div>

</body>
</html>
